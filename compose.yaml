services:
  backend:
    build:
      context: ./apps/backend
    env_file:
      - path: ./apps/backend/.env.sample
      - path: ./apps/backend/.env
        required: false
    environment:
      BOILERPLATE_PRIMARY.ENV: development
      BOILERPLATE_SERVER.PORT: "8080"
      BOILERPLATE_DATABASE.HOST: postgres
      BOILERPLATE_DATABASE.PORT: "5432"
      BOILERPLATE_DATABASE.USER: ${POSTGRES_USER:-postgres}
      BOILERPLATE_DATABASE.PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      BOILERPLATE_DATABASE.NAME: ${POSTGRES_DB:-boilerplate}
      BOILERPLATE_DATABASE.SSL_MODE: disable
      BOILERPLATE_REDIS.ADDRESS: redis:6379
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 60s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-boilerplate}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
  redis_data:
